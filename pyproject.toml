[project]
name = "aip"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.12.0",
    "gradio>=5,<6",
    "modelscope==1.34.0",
    "numpy>=2.5.5",
    "pydantic>=2,<3",
    "qwen-tts==0.1.1",
    "setuptools<81",
    "soundfile>=0.14.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
